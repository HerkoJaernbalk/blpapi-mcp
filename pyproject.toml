[project]
name = "blpapi-mcp"
version = "0.2.0"
description = "A MCP server providing financial data from Bloomberg blpapi"
readme = "README.md"
authors = [
    { name = "Henrik Jernbeck", email = "henrik.jernbeck@gmail.com" }
]
# Original author: Samuel Seng <djsamseng@gmail.com>
requires-python = ">=3.10, <3.13"
dependencies = [
    # Tool calls run in worker threads via anyio.to_thread (also an MCP SDK dependency).
    "anyio>=4.0",
    "blpapi>=3.25.3",
    # The server uses the MCP SDK v1 FastMCP API. SDK v2 renamed and moved it.
    "mcp[cli]>=1.6.0,<2",
]

[project.scripts]
blpapi-mcp = "blpapi_mcp:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
blpapi = { index = "blpapi" }

[[tool.uv.index]]
name = "blpapi"
url = "https://blpapi.bloomberg.com/repository/releases/python/simple/"
explicit = true
